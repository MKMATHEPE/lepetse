server:
  address: ${SERVER_ADDRESS:127.0.0.1}
  port: ${PORT:8080}
  servlet:
    session:
      timeout: 20m
      cookie:
        http-only: true
        same-site: strict
        secure: ${SESSION_COOKIE_SECURE:false}
  compression:
    enabled: true
    mime-types: application/json,text/html,text/css,application/javascript
spring:
  application:
    name: lepetse-backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://${DB_HOST:127.0.0.1}:${DB_PORT:5432}/${DB_NAME:lepetse}}
    username: ${DB_USERNAME:lepetse}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    clean-disabled: true
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 55MB
lepetse:
  rfq:
    storage-directory: ${RFQ_STORAGE_DIRECTORY:./var/rfq-files}
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
