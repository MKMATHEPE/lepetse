server:
  address: ${SERVER_ADDRESS:127.0.0.1}
  port: ${PORT:8080}
  compression:
    enabled: true
    mime-types: application/json,text/html,text/css,application/javascript
spring:
  application:
    name: lepetse-backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://127.0.0.1:5432/lepetse}
    username: ${DB_USERNAME:lepetse}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    clean-disabled: true
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
